name: Astra2 upload workflow
on:
  push:
    branches: [fiori-astra2]
  pull_request:
    branches: [fiori-astra2]
permissions: {contents: read}
jobs:
  fixture-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fiori-astra2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install openpyxl==3.1.5 defusedxml==0.7.1
      - run: node --test test/client.test.cjs
      - name: Validate XML, bindings and localized labels
        run: |
          python - <<'PY'
          import json,re,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path('webapp'); json.loads((root/'manifest.json').read_text());xml=(root/'view/Upload.view.xml').read_text();ET.fromstring(xml);ET.parse('test/metadata.xml');ctrl=(root/'controller/Upload.controller.js').read_text();texts=(root/'i18n/i18n.properties').read_text();assert all(re.search(r'^'+key+r'=',texts,re.M) for key in re.findall(r'\{i18n>(\w+)\}',xml));assert all(re.search(r'\b'+handler+r'\s*:',ctrl) for handler in re.findall(r'="\.(\w+)"',xml));
          PY
      - name: Exercise loopback service with real workbooks
        run: |
          python test/demo_server.py > "$RUNNER_TEMP/astra2-demo.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8080/ -o /dev/null && break; sleep .2; done
          python test/test_demo.py -v
