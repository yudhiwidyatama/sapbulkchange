name: Astra2 Fiori page smoke
on:
  pull_request:
    branches: [fiori-astra2]
  push:
    branches: [fiori-astra2]
permissions: {contents: read}
jobs:
  ui5-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: fiori-astra2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install openpyxl==3.1.5 defusedxml==0.7.1 selenium==4.27.1
      - name: Run real SAPUI5 browser workflow with local test data
        run: |
          python test/demo_server.py > "$RUNNER_TEMP/fi-page.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8080/ -o /dev/null && break; sleep .2; done
          python test/test_page.py
