name: Diagnose Astra UI5 launch
on:
  push:
    branches: [test/astra2-upload-page]
    paths: [.github/workflows/astra-diagnostic-once.yml]
permissions: {actions: read, pull-requests: write}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 46126086578 --repo "$GITHUB_REPOSITORY" --log-failed | grep -E 'Browser console:|Page text:|TimeoutException|AssertionError' | tail -5 > /tmp/why
          gh pr comment 4 --repo "$GITHUB_REPOSITORY" --body-file /tmp/why
