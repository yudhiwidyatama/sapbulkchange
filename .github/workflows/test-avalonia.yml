name: Avalonia tests
on:
  pull_request:
    paths: ['avalonia-app/**', '.github/workflows/test-avalonia.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test avalonia-app/tests/SapBulkChange.Tests/SapBulkChange.Tests.csproj --configuration Release
